<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cambiar país · Localía</title>
<style>
:root{--bg:#0b1627;--card:#111f35;--line:#223754;--ink:#e6edf6;--muted:#93a6bf;--sky:#4f9de6;--stamp:#ab93f3;--ok:#43c690;--bad:#f07068}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(600px 300px at 90% -10%,#1c3b66,transparent 60%),var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:18px}
.k{font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#e2b04e}
h1{font-size:24px;line-height:1.15;margin:8px 0 4px;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--stamp)}
.ip{font:600 13.5px ui-monospace,Menlo,monospace;color:var(--muted)}
.list{display:grid;gap:8px;margin:18px 0}
button{all:unset;box-sizing:border-box;cursor:pointer}
.c{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1.5px solid var(--line)}
.c:hover{border-color:#34507a}
.c.on{border-color:var(--stamp);background:#1d1840}
.c .code{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 12.5px ui-monospace,Menlo,monospace;border:2px solid var(--stamp);color:var(--stamp);flex:none}
.c b{display:block;font-size:15.5px}.c small{color:var(--muted)}
.c .tag{margin-left:auto;font-size:12px;color:var(--ok);font-weight:600}
.msg{min-height:22px;font-size:13.5px;color:var(--muted)}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.b{padding:9px 14px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:14px}
.b:hover{background:#16284a}
.note{margin-top:14px;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="k">Localía · tu identidad</div>
<h1 id="t">Mirando…</h1>
<div class="ip" id="ip"></div>
<div class="list" id="list"></div>
<div class="msg" id="msg"></div>
<div class="row"><button class="b" id="check">🛡️ Verificar mi IP</button></div>
<p class="note">Al cambiar, tu PC deja de salir a internet por unos segundos hasta que el túnel nuevo está listo: nunca sale por otro país.</p>
<script>
const N={US:'Estados Unidos',BR:'Brasil',AR:'Argentina',UY:'Uruguay',IL:'Israel',ES:'España',CL:'Chile',MX:'México',PE:'Perú',CO:'Colombia',PY:'Paraguay'};
let st=null,busy=false;
const $=id=>document.getElementById(id);
const api=(p,b)=>fetch(p,b?{method:'POST',headers:{'Content-Type':'application/json','X-Localia':'1'},body:JSON.stringify(b)}:{cache:'no-store'}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Error');return j});
function msg(t,cls){$('msg').textContent=t||'';$('msg').className='msg '+(cls||'')}
function showId(i){if(!i||!i.online){$('t').innerHTML='<span style="color:var(--bad)">Sin internet ahora</span>';$('ip').textContent='';return}
 $('t').innerHTML=`Te ven en <em>${i.city||'?'}, ${N[i.country]||i.country}</em>`;$('ip').textContent='IP '+i.ip}
function render(){$('list').innerHTML=st.exits.map(e=>`<button class="c ${e.code===st.active?'on':''}" data-c="${e.code}"><span class="code">${e.code}</span><span><b>${e.name}</b><small>${e.city}</small></span>${e.code===st.active?'<span class="tag">✓ Tu país ahora</span>':''}</button>`).join('')}
async function load(){try{st=await api('/api/state');render()}catch(e){msg(e.message,'bad')}}
async function check(){msg('Chequeando…');try{const i=await api('/api/identity');showId(i);msg(i.online?'Listo.':'Sin internet por el momento.',i.online?'ok':'bad');return i}catch(e){msg(e.message,'bad')}}
$('list').addEventListener('click',async ev=>{const b=ev.target.closest('[data-c]');if(!b||busy)return;const c=b.dataset.c;if(c===st.active)return;
 busy=true;msg(`Cambiando a ${N[c]||c}…`);
 try{await api('/api/exit',{code:c});st.active=c;render();
  let i=null;for(let k=0;k<8;k++){await new Promise(r=>setTimeout(r,2000));i=await api('/api/identity').catch(()=>null);if(i&&i.online&&i.country===c)break}
  showId(i);msg(i&&i.online&&i.country===c?`Listo: ahora te ven en ${i.city||''}, ${N[c]||c}.`:'Cambiado. El chequeo tarda un poco más: tocá "Verificar mi IP".',i&&i.online&&i.country===c?'ok':'')}
 catch(e){msg(e.message,'bad')}busy=false});
$('check').addEventListener('click',check);
load().then(check);
</script>
</body>
</html>
