<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Localía — tu PC en tu país</title>
<meta name="description" content="Localía by Slonimtek: una computadora en la nube que vive cerca tuyo y sale a internet por el país que elijas. Abrila desde el navegador y los sitios te ven como alguien de ahí. Mockup navegable.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2.5c-6.4 0-11.5 5-11.5 11.2C4.5 21.6 16 29.5 16 29.5s11.5-7.9 11.5-15.8C27.5 7.5 22.4 2.5 16 2.5z' fill='%231c6cb5'/%3E%3Crect x='9.6' y='8.2' width='12.8' height='8.6' rx='1.8' fill='%23fff'/%3E%3Crect x='13.2' y='18.4' width='5.6' height='1.8' rx='.9' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5f9;--surface:#fff;--surface-2:#edf2f8;--surface-3:#e1e9f3;
  --line:#d8e0eb;--line-2:#c3cfdf;
  --ink:#0c1a2c;--ink-2:#33455e;--muted:#5f718a;
  --sky:#1c6cb5;--sky-hi:#2a82d2;--sky-soft:#e2eefa;--sky-ink:#0e4c88;--on-sky:#fff;
  --sol:#a8740f;--sol-hi:#d19a2c;--sol-soft:#f9eed6;--on-sol:#231600;
  --mini:#64748b;--on-mini:#fff;
  --stamp:#5a3ea6;
  --ok:#137f55;--ok-soft:#ddf2e8;--warn:#a86400;--warn-soft:#fbeed5;--bad:#c2352d;--bad-soft:#fbe3e1;
  --shadow:0 1px 2px rgba(12,26,44,.05),0 10px 30px -10px rgba(12,26,44,.2);
  --r:16px;--rib:37px;
  --font-d:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --font:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09111e;--surface:#0f1a2b;--surface-2:#142238;--surface-3:#1b2b44;--line:#1f3049;--line-2:#2c4262;
  --ink:#e6edf6;--ink-2:#b6c5d8;--muted:#8397b1;
  --sky:#5aa6ec;--sky-hi:#79b8f1;--sky-soft:#14304f;--sky-ink:#a5cff5;--on-sky:#04111f;
  --sol:#e2b04e;--sol-hi:#e8bd62;--sol-soft:#33280f;--mini:#94a3b8;--on-mini:#0b1220;
  --stamp:#ab93f3;--ok:#43c690;--ok-soft:#0f3325;--warn:#e9a946;--warn-soft:#3a2a10;--bad:#f07068;--bad-soft:#3d1715;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -12px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09111e;--surface:#0f1a2b;--surface-2:#142238;--surface-3:#1b2b44;--line:#1f3049;--line-2:#2c4262;
  --ink:#e6edf6;--ink-2:#b6c5d8;--muted:#8397b1;
  --sky:#5aa6ec;--sky-hi:#79b8f1;--sky-soft:#14304f;--sky-ink:#a5cff5;--on-sky:#04111f;
  --sol:#e2b04e;--sol-hi:#e8bd62;--sol-soft:#33280f;--mini:#94a3b8;--on-mini:#0b1220;
  --stamp:#ab93f3;--ok:#43c690;--ok-soft:#0f3325;--warn:#e9a946;--warn-soft:#3a2a10;--bad:#f07068;--bad-soft:#3d1715;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -12px rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--font-d);letter-spacing:-.02em;margin:0;line-height:1.1}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
.i{width:18px;height:18px;flex:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
@media(max-width:600px){.wrap{padding:0 16px}}
.muted{color:var(--muted)}.sm{font-size:13.5px}.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sol);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;color:var(--ink-2);white-space:nowrap}
.chip .i{width:14px;height:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px;text-decoration:none;transition:filter .15s,background .15s,border-color .15s;white-space:nowrap}
.btn .i{width:17px;height:17px}
.btn-primary{background:var(--sky);color:var(--on-sky)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{border-color:var(--line-2);color:var(--ink);background:var(--surface)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:7px 14px;font-size:14px}
.btn-lg{padding:14px 24px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

/* ribbon */
.ribbon{background:#0c1a2c;color:#c9d6e6;font:500 12.5px/1 var(--font);border-bottom:1px solid #1d2d45}
.rib-in{display:flex;gap:2px;align-items:center;overflow-x:auto;white-space:nowrap;padding:6px 16px;scrollbar-width:none;max-width:1400px;margin:0 auto}
.rib-in::-webkit-scrollbar{display:none}
.rib-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;background:#d19a2c;color:#1b1200;padding:5px 7px;border-radius:5px;margin-right:8px}
.rib-in a{color:inherit;text-decoration:none;padding:6px 9px;border-radius:6px}
.rib-in a:hover{background:#1a2b44;color:#fff}
.rib-in a.on{background:#24406a;color:#fff}
.rib-sep{opacity:.3;padding:0 3px}

/* topbar */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink)}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font-family:var(--font-d);font-weight:800;font-size:21px;letter-spacing:-.03em}
.brand small{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;border-left:1px solid var(--line-2);padding-left:10px;margin-left:2px;white-space:nowrap}
.top-nav{display:flex;align-items:center;gap:6px}
.lnk{color:var(--ink-2);text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:500;font-size:15px}
.lnk:hover{background:var(--surface-2)}
.icon-btn{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
@media(max-width:820px){.top-nav .lnk{display:none}}
@media(max-width:420px){.brand small{display:none}}

/* stamp */
.stamp{display:block;overflow:visible}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:
  repeating-radial-gradient(circle at 88% 18%,transparent 0 9px,color-mix(in srgb,var(--sky) 10%,transparent) 9px 10px),
  repeating-radial-gradient(circle at 58% 112%,transparent 0 9px,color-mix(in srgb,var(--stamp) 8%,transparent) 9px 10px);
  -webkit-mask-image:linear-gradient(to left,#000 25%,transparent 80%);mask-image:linear-gradient(to left,#000 25%,transparent 80%)}
.hero-in{position:relative;display:grid;grid-template-columns:1.02fr 1fr;gap:56px;align-items:center;padding-top:68px;padding-bottom:84px}
.hero h1{font-size:clamp(38px,5.3vw,66px);font-weight:800;line-height:1.02;letter-spacing:-.035em;margin:14px 0 18px}
.hero h1 em{font-style:normal;color:var(--sky)}
.lead{font-size:19px;color:var(--ink-2);max-width:34em}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 22px}
.proof{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--ink-2);font-size:14.5px}
.proof li{display:flex;align-items:center;gap:6px}
.proof .i{color:var(--ok);width:17px;height:17px}
@media(max-width:920px){.hero-in{grid-template-columns:1fr;gap:34px;padding-top:40px;padding-bottom:56px}}
.hero-vis{position:relative;padding:4px 0 34px;transition:opacity .35s}
.hero-vis.fade{opacity:0}
.route{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.rt-end{display:flex;align-items:center;gap:10px}
.rt-end b{display:block;font-size:13px;line-height:1.25}
.rt-end small{display:block;color:var(--muted);font-size:12.5px;line-height:1.25;white-space:nowrap}
.rt-to{text-align:right}
.rt-code{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;border:1.5px solid var(--line-2);background:var(--surface);flex:none}
.rt-to .rt-code{border:2px solid var(--stamp);color:var(--stamp)}
.rt-line{flex:1;height:2px;position:relative;background-image:linear-gradient(90deg,var(--line-2) 50%,transparent 0);background-size:10px 2px;min-width:30px}
.rt-line span{position:absolute;top:-4px;left:0;width:10px;height:10px;border-radius:50%;background:var(--sky);box-shadow:0 0 0 4px color-mix(in srgb,var(--sky) 22%,transparent);animation:travel 2.6s ease-in-out infinite}
@keyframes travel{0%{left:0}100%{left:calc(100% - 10px)}}
.bw{border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.bw-bar{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.bw-bar i{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.bw-url{margin-left:10px;font-size:11.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 10px;flex:1;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wall{background:radial-gradient(900px 500px at 85% -20%,#2a82d2 0%,transparent 60%),radial-gradient(700px 420px at -10% 120%,#5a3ea6 0%,transparent 58%),linear-gradient(160deg,#0f2747,#0a1629)}
.bw-desk{position:relative;aspect-ratio:16/10;overflow:hidden}
.bw-stamp{position:absolute;right:-24px;bottom:-40px;color:#fff;opacity:.15;transform:rotate(-12deg)}
.mini-win{position:absolute;left:8%;top:11%;width:min(64%,300px);background:#fff;color:#0c1a2c;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.35);padding:12px 14px;font-size:12.5px}
.mini-tt{font-weight:700;font-size:13px;margin-bottom:6px;padding-bottom:8px;border-bottom:1px solid #e3e9f1}
.mini-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;color:#5f718a}
.mini-row b{color:#0c1a2c;font-weight:600}
.mini-row b.ok{color:#137f55}
.mini-task{position:absolute;left:0;right:0;bottom:0;height:30px;background:rgba(8,16,30,.72);display:flex;align-items:center;gap:8px;padding:0 10px}
.mini-start{width:14px;height:14px;border-radius:3px;background:linear-gradient(135deg,#6db0ee,#2a82d2)}
.mini-app{width:14px;height:14px;border-radius:3px;background:rgba(255,255,255,.28)}
.mini-clock{margin-left:auto;color:#fff;font-size:11px}
.float{position:absolute;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;box-shadow:var(--shadow);white-space:nowrap;color:var(--ink)}
.float .i{width:17px;height:17px;color:var(--sky)}
.f1{left:-18px;bottom:78px}.f2{right:-16px;top:104px}.f3{right:22px;bottom:4px}
@media(max-width:600px){.f1{left:-6px;bottom:70px}.f2{right:-6px;top:84px}.float{font-size:12px;padding:7px 10px}.f3{right:8px}}

/* sections */
.sec{padding:84px 0;border-bottom:1px solid var(--line)}
.sec.alt{background:var(--surface)}
@media(max-width:600px){.sec{padding:56px 0}}
.sec-head{max-width:760px;margin-bottom:34px}
.sec-head h2{font-size:clamp(30px,3.6vw,44px);font-weight:800;margin:10px 0 12px}
.sec-head p{color:var(--ink-2);font-size:17.5px}
.uses{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.use-card{padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.use-card .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--sky-soft);color:var(--sky-ink);margin-bottom:16px}
.use-card .ic .i{width:22px;height:22px}
.use-card h3{font-size:19px;margin-bottom:8px}
.use-card p{color:var(--ink-2);font-size:15px}
@media(max-width:980px){.uses{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.uses{grid-template-columns:1fr}}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:820px){.steps3{grid-template-columns:1fr}}
.st{padding:24px;border-radius:var(--r);background:var(--bg);border:1px solid var(--line)}
.st .n{font-family:var(--mono);font-size:13px;color:var(--sol);letter-spacing:.1em}
.st h3{font-size:22px;margin:10px 0 8px}
.st p{color:var(--ink-2);font-size:15px}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:820px){.plans{grid-template-columns:1fr}}
.plan{position:relative;display:flex;flex-direction:column;gap:10px;padding:24px 22px 20px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.plan::before,.tier::before{content:"";position:absolute;left:22px;top:0;width:44px;height:4px;border-radius:0 0 4px 4px;background:var(--tc)}
.plan-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.plan .btn{margin-top:auto;align-self:flex-start}
.cmp-wrap{overflow-x:auto;border-radius:var(--r)}
.cmp{width:100%;min-width:560px;border-collapse:separate;border-spacing:0;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:15px}
.cmp th,.cmp td{padding:14px 18px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.cmp thead th{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);font-weight:500}
.cmp tbody th{font-weight:600;color:var(--ink-2);width:24%}
.cmp td{color:var(--ink-2)}
.cmp td:last-child{background:color-mix(in srgb,var(--sky) 7%,var(--surface));color:var(--ink);font-weight:600}
.cmp tr:last-child td,.cmp tr:last-child th{border-bottom:0}
.trust{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
@media(max-width:1020px){.trust{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.trust{grid-template-columns:1fr}}
.tr{padding:20px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.tr .i{width:24px;height:24px;color:var(--stamp);margin-bottom:12px}
.tr b{display:block;font-size:16px;margin-bottom:6px}
.tr p{font-size:14.5px;color:var(--ink-2)}
.faq{display:grid;gap:0;max-width:820px;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line);padding:4px 0}
.faq summary{cursor:pointer;list-style:none;padding:16px 36px 16px 0;font-weight:600;font-size:17px;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:6px;top:12px;font-size:24px;font-weight:400;color:var(--muted);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 0 18px;color:var(--ink-2);max-width:44em}
.cta-card{display:flex;align-items:center;gap:26px;padding:30px;border-radius:22px;background:var(--surface);border:1px solid var(--line);flex-wrap:wrap}
.cta-card .stamp{color:var(--stamp);transform:rotate(-10deg)}
.cta-card h2{font-size:clamp(26px,3vw,36px);font-weight:800}
.cta-card p{color:var(--ink-2);margin-top:6px}
.cta-card .btn{margin-left:auto}
@media(max-width:700px){.cta-card .btn{margin-left:0}}
.foot{padding:34px 0 60px}
.foot-in{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px}

/* wizard */
.wiz{padding-top:26px;padding-bottom:110px}
.stepper{display:flex;gap:6px;margin:0 0 26px;overflow-x:auto;scrollbar-width:none;padding:2px}
.stepper::-webkit-scrollbar{display:none}
.stp{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none}
.stp .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12px;background:var(--surface-2)}
.stp.on{border-color:var(--sky);color:var(--ink)}.stp.on .n{background:var(--sky);color:var(--on-sky)}
.stp.done{color:var(--ink-2)}.stp.done .n{background:var(--ok-soft);color:var(--ok)}
.wiz-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.wiz-main{min-width:0}
@media(max-width:1060px){.wiz-grid{grid-template-columns:1fr}}
.step-head h2{font-size:clamp(28px,3.4vw,40px);font-weight:800;margin:8px 0 10px}
.sub{color:var(--ink-2);font-size:16.5px;max-width:42em}
.origin{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin:22px 0 4px;padding:10px 14px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--line-2);font-size:14.5px;color:var(--ink-2)}
.origin > span{display:inline-flex;align-items:center;gap:6px}
.origin .i{width:16px;height:16px;color:var(--sky)}
.sel,.origin select{font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;max-width:100%}
.grp{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px;font-weight:500}
.cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
@media(max-width:560px){.cc-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.cc-grid .cc{grid-template-columns:1fr;padding:12px}.cc-grid .cc-code{grid-row:auto;width:38px;height:38px;font-size:12.5px;margin-bottom:4px}}
.cc{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;align-items:center;text-align:left;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);transition:transform .15s,border-color .15s}
.cc:hover:not([disabled]){border-color:var(--line-2);transform:translateY(-1px)}
.cc.on{border-color:var(--stamp);box-shadow:0 0 0 3px color-mix(in srgb,var(--stamp) 18%,transparent)}
.cc[disabled]{opacity:.6;cursor:not-allowed}
.cc-code{grid-row:1/3;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;border:1.5px dashed var(--line-2);color:var(--ink-2)}
.cc.on .cc-code{border:2px solid var(--stamp);color:var(--stamp);background:color-mix(in srgb,var(--stamp) 9%,transparent)}
.cc-txt b{display:block;font-size:15.5px;line-height:1.2}
.cc-txt small{color:var(--muted);font-size:13px}
.cc-lat{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}

function qrSVG(){let seed=42;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};const N=25;let r='';
 const finder=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#0c1a2c"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#0c1a2c"/>`;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const inF=(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);if(!inF&&rnd()<.48)r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#0c1a2c"/>`}
 return `<svg class="qr" viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" role="img" aria-label="Código de ejemplo">${r}${finder(0,0)}${finder(N-7,0)}${finder(0,N-7)}</svg>`}

 fibra:()=>{S.fibra=!S.fibra;rerender()},
 conexion:()=>{S.conexion=!S.conexion;rerender()},
 'ask-country':()=>openModal(`<h3>¿Qué país necesitás?</h3><p>Sumar un país es rápido: solo hace falta una salida ahí. Elegí uno y te avisamos cuando llegue.</p><div class="chips" style="margin-top:14px">${['Bolivia','Ecuador','Venezuela','Canadá','Italia','Alemania','Reino Unido','Francia'].map(n=>`<button class="tog" data-act="notify" data-n="${n}">${n}</button>`).join('')}</div><div class="modal-act"><button class="btn btn-ghost btn-sm" data-act="close-modal">Cerrar</button></div>`),
 notify:el=>{closeModal();toast(`Listo: te avisamos por WhatsApp cuando llegue ${el.dataset.n}.`)},
 tier:el=>{S.tier=el.dataset.tier;rerender()},
 os:el=>{S.os=el.dataset.os;rerender()},
 app:el=>{const k=el.dataset.app;S.apps.has(k)?S.apps.delete(k):S.apps.add(k);rerender()},
 idle:el=>{S.idle=el.dataset.v;rerender()},
 kyc:()=>{if(S.kyc!=='none')return;S.kyc='run';rerender();const lis=$$('#kycList li');lis.forEach((li,i)=>later(()=>li.classList.add('ok'),450*(i+1)));later(()=>{S.kyc='done';rerender()},450*(lis.length+1)+200)},
 cycle:el=>{S.cycle=el.dataset.v;rerender()},
 pay:el=>{S.pay=el.dataset.v;rerender()},
 next:()=>go('armar/'+(S.step+1)),
 prev:()=>go(S.step>1?'armar/'+(S.step-1):'inicio'),
 checkout:el=>{el.disabled=true;el.innerHTML=`${ico.clock} ${S.pay==='mp'?'Conectando con MercadoPago…':'Procesando el pago…'}`;later(()=>go('armando'),1100)},
 tab:el=>{S.tab=el.dataset.tab;if(parse().r!=='panel'){go('panel');return}rerender();if(S.tab!=='resumen'){const d=$('.tabs');d&&d.scrollIntoView({behavior:'smooth',block:'start'})}},
 openpc:()=>go('pc'),
 'use-exit':el=>{const p=pcs();p.active=el.dataset.code;rerender();toast(`Listo: ahora te ven en ${C[p.active].city}, ${C[p.active].name}.`)},
 'add-exit':()=>{const p=pcs();const opts=COUNTRIES.filter(x=>!x.soon&&!p.exits.includes(x.code));openModal(`<h3>Agregar un país</h3><p>Se suma a tu misma PC, con su propia IP fija. US$ ${EXTRA} por mes. Está listo en un par de minutos.</p><div class="chips" style="margin-top:14px">${opts.map(o=>`<button class="tog" data-act="do-add-exit" data-code="${o.code}">${ico.plus} ${o.name}</button>`).join('')}</div><div class="modal-act"><button class="btn btn-ghost btn-sm" data-act="close-modal">Cancelar</button></div>`)},
 'do-add-exit':el=>{const p=pcs();const k=el.dataset.code;p.exits.push(k);S.extras.add(k);closeModal();if(parse().r!=='panel'){S.tab='paises';go('panel')}else{S.tab='paises';rerender()}toast(`Sumamos ${C[k].name} con su IP fija. Ya lo podés usar.`)},
 'conexion-on':()=>{S.conexion=true;rerender();toast('Listo: ya podés conectar tu tele y tu celular.')},
 'connect-dev':()=>{const c=C[pcs().active];openModal(`<h3>Conectá tu tele o tu celular</h3><ol class="steps-ol"><li>En tu tele o celular, instalá la app de Localía.</li><li>Escaneá este código.</li><li>Listo: sale por ${c.name} con tu IP fija.</li></ol>${qrSVG()}<p class="fine" style="text-align:center">Código de ejemplo del mockup.</p><div class="modal-act"><button class="btn btn-primary btn-sm" data-act="close-modal">Listo</button></div>`)},
 'to-devices':()=>{S.tab='paises';go('panel')},
 power:()=>{const p=pcs();if(p.state==='on'){p.state='stopping';rerender();setTimeout(()=>{p.state='off';if(parse().r==='panel')rerender();toast('Tu PC se apagó. Tus archivos quedan guardados.')},1400)}else if(p.state==='off'){p.state='starting';rerender();setTimeout(()=>{p.state='on';if(parse().r==='panel')rerender();toast('Tu PC está prendida.')},1800)}},
 restart:()=>{const p=pcs();if(p.state!=='on')return;p.state='restarting';rerender();setTimeout(()=>{p.state='on';if(parse().r==='panel')rerender();toast('Listo, tu PC se reinició.')},2000)},
 broken:()=>openModal(`<h3>¿Qué le pasa a tu PC?</h3><p>Probá en este orden. El primero arregla casi todo.</p>
  <button class="fix" data-act="fix-restart"><span class="n">1</span><span><b>Reiniciarla</b><small>Tarda un minuto. No se pierde nada.</small></span></button>
  <button class="fix" data-act="fix-restore"><span class="n">2</span><span><b>Volver a como estaba anoche</b><small>Usa la copia de hoy a las 03:00.</small></span></button>
  <button class="fix" data-act="fix-support"><span class="n">3</span><span><b>Hablar con una persona</b><small>Por WhatsApp, en español, de 8 a 22 h.</small></span></button>
  <div class="modal-act"><button class="btn btn-ghost btn-sm" data-act="close-modal">Cerrar</button></div>`),
 'fix-restart':()=>{closeModal();if(pcs().state==='on')A.restart();else toast('Tu PC está apagada: prendela y listo.')},
 'fix-restore':()=>A.restore({dataset:{i:'0'}}),
 'fix-support':()=>{closeModal();S.tab='soporte';rerender()},
 restore:el=>{const i=+el.dataset.i;const d=backupDates()[i];openModal(`<h3>Volver al ${d.long}</h3><p>Tu PC va a quedar exactamente como estaba el <b>${d.long} a las 03:00</b>. Lo que hiciste después se pierde, pero antes guardamos una copia de ahora, por las dudas.</p><div class="bar" id="rBar" hidden><span></span></div><div class="modal-act" id="rAct"><button class="btn btn-ghost" data-act="close-modal">Cancelar</button><button class="btn btn-primary" data-act="do-restore" data-i="${i}">Sí, volver a ese día</button></div>`)},
 'do-restore':el=>{const d=backupDates()[+el.dataset.i];$('#rAct').hidden=true;const b=$('#rBar');b.hidden=false;const s=b.firstElementChild;s.style.transition='width 2.2s ease';requestAnimationFrame(()=>requestAnimationFrame(()=>{s.style.width='100%'}));setTimeout(()=>{closeModal();toast(`Listo: tu PC volvió al ${d.long}.`)},2400)},
 'file-restore':()=>toast('Elegís el archivo y el día, y aparece de nuevo en tu escritorio.'),
 'plan-change':el=>{const to=el.dataset.tier;if(to===S.tier)return;const from=pcPrice(S.tier,S.origin,S.os),nw=pcPrice(to,S.origin,S.os);const diff=Math.round((nw-from)*28/30);const up=nw>from;const T=TIERS[to];
  openModal(`<h3>Pasar a ${T.name}</h3><p>Tu PC pasa a <b>${T.cpu} vCPU · ${T.ram} GB de RAM</b> y la PC queda en <b>US$ ${nw} por mes</b> (más tus países y extras).</p><p style="margin-top:8px">${up?`Hoy pagás la diferencia por lo que queda del mes: <b>US$ ${diff}</b>.`:`Te descontamos la diferencia en la próxima factura: <b>US$ ${-diff}</b>.`} Se aplica con un reinicio de un minuto y tus archivos quedan igual.</p><div class="modal-act"><button class="btn btn-ghost" data-act="close-modal">Cancelar</button><button class="btn btn-primary" data-act="do-plan" data-tier="${to}">Confirmar</button></div>`)},
 'do-plan':el=>{S.tier=el.dataset.tier;closeModal();rerender();toast(`Listo: tu PC ahora es ${TIERS[S.tier].name}. Se aplica en el próximo reinicio.`)},
 'move-pc':()=>{const opts=Object.entries(ORIGINS).filter(([k])=>k!==S.origin);S.moveTo=opts[0][0];
  openModal(`<h3>Mover tu PC cerca tuyo</h3><p>Si te mudaste, movemos tu PC a una zona cerca de tu casa nueva para que siga rápida. Tus países, tus IP fijas y tus archivos no cambian. Tarda unos 20 minutos.</p><label class="field-l" for="mv">Ahora vivo en</label><select id="mv" class="sel" data-chg="move">${opts.map(([k,v])=>`<option value="${k}">${v.label} → PC en ${v.pc}</option>`).join('')}</select><div class="modal-act"><button class="btn btn-ghost" data-act="close-modal">Cancelar</button><button class="btn btn-primary" data-act="do-move-pc">Mover mi PC</button></div>`)},
 'do-move-pc':()=>{S.origin=S.moveTo;closeModal();rerender();toast(`Moviendo tu PC a ${zone().pc}. Tus países e IPs quedan igual.`)},
 pause:()=>toast('Tu PC queda pausada hasta que vuelvas. Pagás solo el disco y tus IPs.'),
 quick:el=>{const k=el.dataset.k;const c=C[pcs().active];S.chat.push({me:true,t:QUICK.find(x=>x[0]===k)[1]});S.typing=true;rerender();
  setTimeout(()=>{S.typing=false;S.chat.push({me:false,t:REPLY[k](c)});if(parse().r==='panel'&&S.tab==='soporte')rerender()},1100)},
 'close-modal':()=>closeModal(),
 open:el=>{const w=el.dataset.w;const desk=$('#desk');let node=desk.querySelector(`[data-win="${w}"]`);if(!node){desk.insertAdjacentHTML('beforeend',win(w,C[pcs().active]));node=desk.querySelector(`[data-win="${w}"]`);if(!S.wins.includes(w))S.wins.push(w)}node.style.zIndex=++z},
 'win-close':el=>{const w=el.closest('.win');if(w){S.wins=S.wins.filter(x=>x!==w.dataset.win);w.remove()}},
 'ses-tool':el=>toast(el.dataset.t==='clip'?'Portapapeles compartido: copiás en tu compu y pegás en tu PC.':'Arrastrá archivos a esta ventana y aparecen en Descargas de tu PC.'),
 'ses-full':()=>{try{const d=document.documentElement;document.fullscreenElement?document.exitFullscreen():d.requestFullscreen&&d.requestFullscreen()}catch(e){}},
 'ops-act':el=>toast(`Mockup: "${el.dataset.b}" abre el detalle del caso.`),
};
let z=10;
const CH={
 origin:el=>{S.origin=el.value;S.calc.zone=el.value;rerender()},
 rules:el=>{S.rules=el.checked;rerender()},
 move:el=>{S.moveTo=el.value},
 exit:el=>switchExit(el.value),
 'dev-country':el=>{const p=pcs();const d=p.devices[+el.dataset.i];d.code=el.value;rerender();toast(`${d.name} ahora sale por ${C[d.code].name}.`)},
 'calc-zone':el=>{S.calc.zone=el.value;updateCalc()},
 'calc-tier':el=>{S.calc.tier=el.value;updateCalc()},
 'calc-os':el=>{S.calc.os=el.value;updateCalc()},
 'calc-n':el=>{S.calc.n=+el.value;updateCalc()},
};
const IN={
 user:el=>{S.user[el.name]=el.value},
 hours:el=>{S.calc.h=+el.value;updateCalc()},
 gb:el=>{S.calc.gb=+el.value;updateCalc()},
};
document.addEventListener('click',e=>{if(e.target.matches('[data-bg]')){closeModal();return}const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el,e)}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&CH[el.dataset.chg])CH[el.dataset.chg](el)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-inp]');if(el&&IN[el.dataset.inp])IN[el.dataset.inp](el)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('pointerdown',e=>{const w=e.target.closest('.win');if(w)w.style.zIndex=++z});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{const el=$('#uchart');if(el)drawUsage(el);setRib()},150)});
function setRib(){const r=$('.ribbon');if(r)document.documentElement.style.setProperty('--rib',r.offsetHeight+'px')}
setInterval(()=>$$('[data-clock]').forEach(el=>el.textContent=clock(el.dataset.clock)),15000);
try{const t=localStorage.getItem('localia-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
setRib();route();
})();
</script>
</body>
</html>
